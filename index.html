
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruleta 1–100</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101010;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}
main{width:min(94vw,620px);text-align:center;background:#1d1d1d;padding:28px 18px;border-radius:24px;box-shadow:0 20px 60px #0009}
h1{margin:0 0 6px}.sub{color:#aaa;margin-bottom:20px}.wheel{position:relative;width:min(78vw,430px);aspect-ratio:1;margin:auto}
.pointer{position:absolute;z-index:4;left:50%;top:-3px;transform:translateX(-50%);border-left:18px solid transparent;border-right:18px solid transparent;border-top:40px solid #ffd400;filter:drop-shadow(0 3px 3px #000)}
canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 9px #ddd,0 0 0 14px #444,0 10px 30px #0008}
#go{margin-top:22px;padding:14px 30px;border:0;border-radius:10px;background:#ffd400;font-size:18px;font-weight:bold;cursor:pointer}
#go:disabled{opacity:.5}.result{min-height:58px;margin-top:18px;font-size:27px;font-weight:bold}.note{color:#999;font-size:13px}
</style>
</head>
<body><main>
<h1>🎡 Ruleta 1–100</h1><div class="sub">Presiona GIRAR cuando estés listo</div>
<div class="wheel"><div class="pointer"></div><canvas id="c" width="800" height="800"></canvas></div>
<button id="go">GIRAR</button><div id="result" class="result"></div>
<div class="note">El número ganador se mantiene oculto hasta que termine el giro.</div>
</main>
<script>
const c=document.getElementById("c"),x=c.getContext("2d"),N=100,s=2*Math.PI/N;
let rot=0,busy=false;
function draw(){let cx=400,cy=400,r=368;x.clearRect(0,0,800,800);
for(let i=0;i<N;i++){let a=-Math.PI/2+i*s,b=a+s;x.beginPath();x.moveTo(cx,cy);x.arc(cx,cy,r,a,b);x.closePath();x.fillStyle=i%2?"#bbb":"#eee";x.fill();x.strokeStyle="#555";x.lineWidth=1;x.stroke()}
x.save();x.translate(cx,cy);x.rotate(rot);
for(let i=0;i<N;i++){let a=-Math.PI/2+(i+.5)*s;x.save();x.rotate(a);x.translate(r*.83,0);x.rotate(Math.PI/2);x.fillStyle="#111";x.font="bold 18px Arial";x.textAlign="center";x.textBaseline="middle";x.fillText(i+1,0,0);x.restore()}x.restore();
x.beginPath();x.arc(cx,cy,42,0,2*Math.PI);x.fillStyle="#222";x.fill();x.strokeStyle="#ffd400";x.lineWidth=7;x.stroke()}
async function go(){
if(busy)return;busy=true;document.getElementById("go").disabled=true;document.getElementById("result").textContent="🎡 Girando...";
const st=performance.now(),start=rot,target=start+Math.PI*2*6+Math.random()*Math.PI*2;
function anim(t){let p=Math.min((t-st)/4500,1),e=1-Math.pow(1-p,4);rot=start+(target-start)*e;draw();if(p<1)requestAnimationFrame(anim)}
requestAnimationFrame(anim);
await new Promise(r=>setTimeout(r,4550));
try{let q=await fetch("/api/reveal",{method:"POST",headers:{"Content-Type":"application/json"}});let d=await q.json();
if(d.winner){document.getElementById("result").textContent="🏆 ¡GANÓ EL "+d.winner+"!";}}
catch(e){document.getElementById("result").textContent="Error al obtener el resultado";}
busy=false;document.getElementById("go").disabled=false;
}
document.getElementById("go").onclick=go;draw();
</script>
</body></html>
